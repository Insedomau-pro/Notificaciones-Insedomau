{% extends "base.html" %}
{% block contenido %}
<h2>{{ usuario and 'Editar' or 'Crear' }} usuario</h2>
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Correo:</label>
  <input type="email" name="correo" value="{{ usuario and usuario[1] or '' }}" required><br>
  <label>Contraseña (deja vacío si no la cambias):</label>
  <input type="password" name="contrasena"><br>
  <label>Rol:</label>
  <select name="rol">
    <option value="profesor" {% if usuario and usuario[2]=='profesor' %}selected{% endif %}>Profesor</option>
    <option value="estudiante" {% if usuario and usuario[2]=='estudiante' %}selected{% endif %}>Estudiante</option>
    <option value="admin" {% if usuario and usuario[2]=='admin' %}selected{% endif %}>Admin</option>
  </select><br>
  <button type="submit" class="boton-editar">Guardar</button>
</form>
{% endblock %}
